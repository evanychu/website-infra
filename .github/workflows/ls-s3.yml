name: List S3 Bucket Objects

on:
  workflow_dispatch:

jobs:
  list-s3-objects:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      # 2. Official AWS Action to configure credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::992887713340:role/TrustActionByGitHub
          aws-region: us-east-1

      # 3. Run the AWS CLI command
      - name: List objects in S3 bucket
        run: |
          aws s3 ls s3://evanychu
