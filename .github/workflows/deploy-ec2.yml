name: Deploy EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::992887713340:role/TrustActionByGitHub
          aws-region: us-east-1

      - name: Update template
        run: |
          cd ec2-launch-template && ./update-ec2-template-stack.sh
